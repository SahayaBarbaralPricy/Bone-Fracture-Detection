{% extends "layout.html" %}

{% block title %}
My Profile | Bone Fracture Detection
{% endblock %}

{% block css %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/profile.css') }}">
{% endblock %}

{% block content %}

<div class="profile-page">

    <!-- Page Header -->
    <div class="page-header">

        <h1>
            <i class="fa-solid fa-user-doctor"></i>
            My Profile
        </h1>

        <p>
            View and update your account information.
        </p>

    </div>

    <!-- Profile Card -->
    <div class="profile-card">

        <!-- Profile Image -->
        <div class="profile-image">

            <img
            src="{{ url_for('static', filename='images/user.jpg') }}"
            alt="User">

            <h2>{{ user[1] }}</h2>

            <span>Registered User</span>

        </div>

        <!-- Profile Form -->
        <div class="profile-form">

            <form method="POST">

                <div class="form-group">

                    <label>Full Name</label>

                    <input
                    type="text"
                    name="fullname"
                    value="{{ user[1] }}"
                    required>

                </div>

                <div class="form-group">

                    <label>Email</label>

                    <input
                    type="email"
                    name="email"
                    value="{{ user[2] }}"
                    required>

                </div>

                <div class="form-group">

                    <label>Phone Number</label>

                    <input
                    type="text"
                    name="phone"
                    value="{{ user[3] }}"
                    required>

                </div>

                <div class="form-group">

                    <label>Username</label>

                    <input
                    type="text"
                    value="{{ user[4] }}"
                    readonly>

                </div>

                <button
                type="submit"
                class="save-btn">

                    <i class="fa-solid fa-floppy-disk"></i>

                    Save Changes

                </button>

            </form>

        </div>

    </div>

</div>

{% endblock %}
